<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Boardgame</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <h1>Online Boardgame</h1>
        <div id="whoami" class="whoami" hidden></div>
    </header>

    <div id="connection" class="connection" role="alert" hidden></div>

    <main>
        <!-- Join: just a name -->
        <section id="screen-join" hidden>
            <h2>Join the game</h2>
            <form id="join-form" novalidate>
                <label for="name">Your name</label>
                <input id="name" name="name" type="text" maxlength="30" autocomplete="nickname" required>

                <button id="join-btn" type="submit" class="primary">Join</button>
                <p id="join-error" class="error" role="alert" hidden></p>
                <p id="join-note" class="note" hidden></p>
            </form>

            <h3>In the waiting room</h3>
            <ul id="join-players" class="players"></ul>
        </section>

        <!-- Waiting room: pick (and change) team and role, then press ready -->
        <section id="screen-wait" hidden>
            <h2>Waiting room</h2>
            <p id="wait-count" class="note"></p>

            <div id="teams" class="teams"></div>
            <p id="wait-unseated" class="note" hidden></p>
            <p id="wait-locked" class="note" hidden>You are ready, so your team and role are locked. Cancel ready to change them.</p>

            <div class="wait-actions">
                <button id="ready-btn" type="button" class="primary" aria-pressed="false">I'm ready</button>
                <button id="leave-btn" type="button" class="link">Leave the waiting room</button>
            </div>
            <p id="wait-error" class="error" role="alert" hidden></p>
        </section>

        <!-- Game -->
        <section id="screen-game" hidden>
            <div id="banner" class="banner"></div>
            <div class="status">
                <div id="score-BLUE" class="score team-BLUE"></div>
                <p id="hint" class="hint"></p>
                <div id="score-RED" class="score team-RED"></div>
            </div>

            <div id="board" class="board"></div>

            <div class="actions">
                <button id="end-turn" type="button" class="primary" hidden>End turn</button>
                <button id="forfeit-btn" type="button" class="danger">Forfeit</button>
                <button id="leave-room-btn" type="button" class="link">Leave the room</button>
                <div id="confirm-box" class="confirm-box" role="group" aria-label="Please confirm" hidden>
                    <span id="confirm-question"></span>
                    <button id="confirm-yes" type="button" class="danger solid"></button>
                    <button id="confirm-no" type="button" class="link">Keep playing</button>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="app.js"></script>
</body>
</html>
