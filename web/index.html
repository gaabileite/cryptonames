<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Boardgame</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <h1>Online Boardgame</h1>
        <div id="whoami" class="whoami" hidden></div>
    </header>

    <div id="connection" class="connection" role="alert" hidden></div>

    <main>
        <!-- Join: pick a name and a seat -->
        <section id="screen-join" hidden>
            <h2>Join the game</h2>
            <form id="join-form" novalidate>
                <label for="name">Your name</label>
                <input id="name" name="name" type="text" maxlength="30" autocomplete="nickname" required>

                <fieldset>
                    <legend>Pick a team and a role</legend>
                    <div id="seats" class="seats"></div>
                </fieldset>

                <button id="join-btn" type="submit" class="primary">Join</button>
                <p id="join-error" class="error" role="alert" hidden></p>
                <p id="join-note" class="note" hidden></p>
            </form>

            <h3>Players so far</h3>
            <ul id="join-players" class="players"></ul>
        </section>

        <!-- Wait: joined, the other seats are still empty -->
        <section id="screen-wait" hidden>
            <h2>Waiting for the other players</h2>
            <p id="wait-count" class="note"></p>
            <ul id="wait-players" class="players"></ul>
        </section>

        <!-- Game -->
        <section id="screen-game" hidden>
            <div id="banner" class="banner"></div>
            <div class="status">
                <div id="score-BLUE" class="score team-BLUE"></div>
                <p id="hint" class="hint"></p>
                <div id="score-RED" class="score team-RED"></div>
            </div>

            <div id="board" class="board"></div>

            <div class="actions">
                <button id="end-turn" type="button" class="primary" hidden>End turn</button>
            </div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="app.js"></script>
</body>
</html>
